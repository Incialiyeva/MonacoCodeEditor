<div class="editor-wrapper">
  <div class="editor-toolbar">
    <div class="toolbar-left">
      <button class="menu-btn" title="Menu">
        <span style="font-size:1.3rem;">&#9776;</span>
      </button>
      <select class="lang-select" [(ngModel)]="selectedLang">
        <option value="js">JavaScript</option>
        <option value="html">HTML</option>
        <option value="sql">SQL</option>
      </select>
    </div>
    <div class="toolbar-center">
      <button class="dark-toggle" title="Toggle dark mode">
        <span style="font-size:1.2rem;">&#9681;</span>
      </button>
    </div>
    <div class="toolbar-right">
      <button class="toolbar-btn">Format Document</button>
      <button class="toolbar-btn">Save</button>
    </div>
  </div>
  <div class="editor-area">
    <div class="line-numbers">
      1<br>2<br>3<br>4<br>5<br>6<br>7<br>8<br>9<br>10
    </div>
    <textarea placeholder="Start coding..." [(ngModel)]="editorValue"></textarea>
  </div>
</div>
