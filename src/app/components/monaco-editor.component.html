<!-- Conditional Toolbar -->
<div class="editor-toolbar" *ngIf="showToolbar">
  <div class="toolbar-header">
    <div class="toolbar-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <polygon points="5,3 19,12 5,21" fill="currentColor"/>
      </svg>
      Run & Debug
    </div>
    <button class="toolbar-close-btn" (click)="closeToolbar()" title="Close Toolbar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
        <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  
  <!-- Run/Debug Controls -->
  <div class="run-debug-controls">
    <button class="toolbar-btn run-btn" 
            (click)="runCode()" 
            [disabled]="isRunning || isDebugging"
            title="Run Code (Ctrl+F5)">
      <svg *ngIf="!isRunning" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <polygon points="5,3 19,12 5,21" fill="currentColor"/>
      </svg>
      <svg *ngIf="isRunning" width="16" height="16" viewBox="0 0 24 24" fill="none" class="spinning">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      {{ isRunning ? 'Running...' : 'Run' }}
    </button>
    
    <button class="toolbar-btn debug-btn" 
            (click)="debugCode()" 
            [disabled]="isRunning || isDebugging"
            title="Debug Code (F5)">
      <svg *ngIf="!isDebugging" width="16" height="16" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
        <path d="M12 1v6M12 17v6M5.64 7.05l4.95 4.95M13.41 13.41l4.95 4.95M1 12h6M17 12h6M5.64 16.95l4.95-4.95M13.41 10.59l4.95-4.95" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg *ngIf="isDebugging" width="16" height="16" viewBox="0 0 24 24" fill="none" class="spinning">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      {{ isDebugging ? 'Debugging...' : 'Debug' }}
    </button>
    
    <button class="toolbar-btn output-btn" 
            (click)="showRunOutput = !showRunOutput"
            [class.active]="showRunOutput"
            title="Toggle Output Panel">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M3 9h18M9 21V9" stroke="currentColor" stroke-width="2"/>
      </svg>
      Output
    </button>
  </div>
</div>
<div class="editor-area" (click)="closeDownloadMenu()">
  <div #editorContainer class="editor-container" style="width:100%;height:400px;"></div>
  <div class="dialog-bottom-buttons">
    <button class="dialog-btn prettier-btn" (click)="formatCode()" title="Format with Prettier">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
        <path d="M8 8h8M8 12h8M8 16h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      Prettier
    </button>
    <button class="dialog-btn diff-btn" (click)="showDiff()" title="Show Diff">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
        <rect x="5" y="5" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2" fill="none"/>
        <path d="M8 9h6M8 13h6M8 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path d="M10 9h6M10 13h6M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="menu-container" (click)="$event.stopPropagation()">
      <button class="dialog-btn menu-btn" (click)="toggleDownloadMenu()" title="Download Options">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="6" r="1" fill="currentColor"/>
          <circle cx="12" cy="12" r="1" fill="currentColor"/>
          <circle cx="12" cy="18" r="1" fill="currentColor"/>
        </svg>
      </button>
      <div class="download-menu" *ngIf="showDownloadMenu">
        <div class="menu-item" (click)="triggerFileUpload()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="17,8 12,3 7,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="3" x2="12" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Upload File
        </div>
        <div class="menu-item" (click)="downloadFile()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="7,10 12,15 17,10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="15" x2="12" y2="3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Download File
        </div>
        <div class="menu-item" (click)="downloadAsZip()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="14,2 14,8 20,8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="16" y1="13" x2="8" y2="13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="16" y1="17" x2="8" y2="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="10,9 11,9 12,9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Download as ZIP
        </div>
      </div>
    </div>
  </div>
  <div class="dialog-bottom-actions">
    <button class="dialog-btn cancel-btn" (click)="revertChanges()" title="Cancel">
      Cancel
    </button>
    <button class="dialog-btn save-btn" (click)="saveCode()" title="Save">
      Save
    </button>
  </div>
</div> 

<!-- Hidden file input for upload -->
<input #fileInput type="file" 
       accept=".js,.html,.sql,.txt,.jsx,.ts,.tsx,.vue,.php,.py,.java,.cpp,.c,.cs,.rb,.go,.rs,.swift,.kt,.scala,.r,.m,.pl,.sh,.bat,.ps1,.yml,.yaml,.json,.xml,.css,.scss,.sass,.less,.md,.markdown"
       style="display: none;"
       (change)="onFileSelected($event)">

<!-- Save Confirmation Modal -->
<div *ngIf="showSaveConfirmation" class="modal-overlay">
  <div class="modal-box save-confirmation-modal">
    <div class="modal-title">Save Changes?</div>
    <div class="modal-content">
      <p>You have unsaved changes. Do you want to save them?</p>
    </div>
    <div class="modal-actions">
      <button class="toolbar-btn modern-btn save-btn" (click)="confirmSave()">Yes, Save</button>
      <button class="toolbar-btn modern-btn" (click)="cancelSave()">No, Discard</button>
    </div>
  </div>
</div>

<!-- Run Output Panel -->
<div *ngIf="showRunOutput" class="output-panel">
  <div class="output-header">
    <div class="output-title">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
        <rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="2"/>
        <path d="M3 9h18M9 21V9" stroke="currentColor" stroke-width="2"/>
      </svg>
      Output
      <span class="execution-time" *ngIf="executionTime > 0">({{ executionTime.toFixed(2) }}ms)</span>
    </div>
    <div class="output-controls">
      <button class="output-control-btn" (click)="clearRunOutput()" title="Clear Output">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="output-control-btn" (click)="closeRunOutput()" title="Close Output">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="output-content">
    <pre>{{ runOutput }}</pre>
  </div>
</div>

<div *ngIf="showSaveModal" class="modal-overlay">
  <div class="modal-box save-modal-box github-style-modal">
    <div class="modal-title">Select files to save</div>
    <div class="choose-all-row">
      <label>
        <input type="checkbox" [(ngModel)]="chooseAllForSave" (change)="toggleChooseAllForSave()" />
        <span style="margin-left:0.5em;font-weight:500;">Choose All</span>
      </label>
    </div>
    <div class="github-modal-content">
      <div class="github-modal-tabs">
        <div *ngFor="let tab of openTabs; let i = index"
             class="github-modal-tab-item"
             [class.active]="activeTabForSave === i"
             [class.selected]="selectedTabsForSave.includes(i)"
             (click)="setActiveTabForSave(i)">
          <input type="checkbox" [checked]="selectedTabsForSave.includes(i)" (click)="$event.stopPropagation(); toggleTabForSave(i)" />
          <span class="tab-name">{{ tab.name }}</span>
        </div>
      </div>
      <div class="github-modal-code-preview">
        <div class="tab-code-preview">
          <div class="diff-view">
            <div class="diff-left">
              <div class="diff-header">Original</div>
              <div class="diff-content" *ngIf="openTabs[activeTabForSave]" [innerHTML]="getActiveTabDiffHTML().left"></div>
            </div>
            <div class="diff-right">
              <div class="diff-header">Modified</div>
              <div class="diff-content" *ngIf="openTabs[activeTabForSave]" [innerHTML]="getActiveTabDiffHTML().right"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="toolbar-btn modern-btn save-btn" (click)="saveSelectedTabs()">Save</button>
      <button class="toolbar-btn modern-btn" (click)="cancelSaveModal()">Cancel</button>
    </div>
  </div>
</div>
